<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Habit & Goal Tracker</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131c2e;
      --item-bg: rgba(255, 255, 255, 0.04);
      --item-hover: rgba(255, 255, 255, 0.07);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.25);
      --border: #1e293b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .widget-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 430px;
      border-radius: 20px;
      border: 1px solid var(--border);
      padding: 22px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .lang-select {
      background: #090d16;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 0.8rem;
      outline: none;
      cursor: pointer;
    }
    .badge {
      background: var(--accent-glow);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 16px;
    }
    .progress-box {
      margin-bottom: 18px;
    }
    .progress-bar-bg {
      background: #1e293b;
      height: 10px;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .progress-bar-fill {
      background: linear-gradient(90deg, #10b981, #34d399);
      height: 100%;
      width: 0%;
      border-radius: 8px;
      transition: width 0.3s ease;
      box-shadow: 0 0 12px var(--accent);
    }
    .stats {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }
    .goal-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
      max-height: 380px;
      overflow-y: auto;
    }
    .goal-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--item-bg);
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      transition: all 0.2s ease;
    }
    .goal-item:hover {
      background: var(--item-hover);
    }
    .goal-item label {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      font-size: 0.92rem;
      width: 100%;
      user-select: none;
    }
    .goal-item input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border: 2px solid #64748b;
      border-radius: 6px;
      cursor: pointer;
      display: grid;
      place-content: center;
      transition: 0.2s;
    }
    .goal-item input[type="checkbox"]:checked {
      background: var(--accent);
      border-color: var(--accent);
    }
    .goal-item input[type="checkbox"]:checked::before {
      content: "✔";
      font-size: 13px;
      color: #000;
      font-weight: bold;
    }
    .goal-item.done label span {
      text-decoration: line-through;
      color: var(--text-muted);
    }
    .delete-btn {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 1.2rem;
      cursor: pointer;
      padding-left: 8px;
    }
    .add-box {
      display: flex;
      gap: 8px;
    }
    .add-box input {
      flex: 1;
      background: #090d16;
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      outline: none;
      font-size: 0.9rem;
    }
    .add-box input:focus {
      border-color: var(--accent);
    }
    .add-box button {
      background: var(--accent);
      color: #052e16;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .reset-link {
      display: block;
      text-align: center;
      margin-top: 14px;
      font-size: 0.78rem;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="widget-card">
  <div class="top-bar">
    <select class="lang-select" id="langSelect" onchange="changeLanguage(this.value)">
      <option value="en">🌐 English (US)</option>
      <option value="es">🇪🇸 Español</option>
      <option value="fr">🇫🇷 Français</option>
      <option value="de">🇩🇪 Deutsch</option>
      <option value="hi">🇮🇳 हिन्दी</option>
    </select>
    <span class="badge" id="streakBadge">⚡ Ready</span>
  </div>

  <div class="header">
    <h1 id="titleText">🎯 Daily Routine OS</h1>
  </div>

  <div class="progress-box">
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
    <div class="stats">
      <span id="progressText">0% Completed</span>
      <span id="ratioText">0/6 Done</span>
    </div>
  </div>

  <ul class="goal-list" id="goalList"></ul>

  <div class="add-box">
    <input type="text" id="customInput" placeholder="+ Add your custom goal...">
    <button id="addBtn" onclick="addCustomGoal()">Add</button>
  </div>

  <span class="reset-link" id="resetBtn" onclick="resetToday()">Reset for a New Day</span>
</div>

<script>
  const translations = {
    en: {
      title: "🎯 Daily Routine OS",
      ready: "⚡ Ready",
      completedBadge: "🔥 100% Done!",
      keepGoing: "⚡ In Progress",
      placeholder: "+ Add custom goal...",
      add: "Add",
      reset: "Reset for a New Day",
      resetConfirm: "Reset today's progress?",
      goals: [
        "💧 2-3L Hydration & Healthy Meals",
        "🏃‍♂️ 30 Min Daily Workout / Movement",
        "💼 Main Focus Task (Deep Work)",
        "🤝 Client Outreach / Networking",
        "💊 Daily Vitamins / Medications",
        "📖 15 Min Reading / Mindset"
      ]
    },
    es: {
      title: "🎯 Rutina Diaria OS",
      ready: "⚡ Listo",
      completedBadge: "🔥 ¡100% Hecho!",
      keepGoing: "⚡ En Progreso",
      placeholder: "+ Añadir meta personal...",
      add: "Añadir",
      reset: "Reiniciar para un nuevo día",
      resetConfirm: "¿Reiniciar el progreso de hoy?",
      goals: [
        "💧 2-3L Hidratación y Comida Sana",
        "🏃‍♂️ 30 Min Ejercicio / Movimiento",
        "💼 Tarea Principal (Trabajo Profundo)",
        "🤝 Contacto con Clientes / Redes",
        "💊 Vitaminas / Medicamentos",
        "📖 15 Min Lectura / Mentalidad"
      ]
    },
    fr: {
      title: "🎯 Routine Quotidienne OS",
      ready: "⚡ Prêt",
      completedBadge: "🔥 100% Terminé!",
      keepGoing: "⚡ En Cours",
      placeholder: "+ Ajouter un objectif...",
      add: "Ajouter",
      reset: "Réinitialiser pour un nouveau jour",
      resetConfirm: "Réinitialiser le progrès d'aujourd'hui?",
      goals: [
        "💧 2-3L Hydratation & Repas Sain",
        "🏃‍♂️ 30 Min Entraînement / Sport",
        "💼 Tâche Principale (Focus)",
        "🤝 Contact Clients / Réseautage",
        "💊 Vitamines / Médicaments",
        "📖 15 Min Lecture / Développement"
      ]
    },
    de: {
      title: "🎯 Tagesroutine OS",
      ready: "⚡ Bereit",
      completedBadge: "🔥 100% Erledigt!",
      keepGoing: "⚡ In Bearbeitung",
      placeholder: "+ Eigenes Ziel hinzufügen...",
      add: "Neu",
      reset: "Für neuen Tag zurücksetzen",
      resetConfirm: "Fortschritt von heute zurücksetzen?",
      goals: [
        "💧 2-3L Wasser & Gesunde Mahlzeiten",
        "🏃‍♂️ 30 Min Training / Bewegung",
        "💼 Hauptaufgabe (Fokusarbeit)",
        "🤝 Kundenkontakt / Networking",
        "💊 Vitamine / Medikamente",
        "📖 15 Min Lesen / Mindset"
      ]
    },
    hi: {
      title: "🎯 Daily Routine OS",
      ready: "⚡ तैयार",
      completedBadge: "🔥 100% Done Hai!",
      keepGoing: "⚡ चालू है",
      placeholder: "+ अपना कस्टम गोल लिखें...",
      add: "जोड़ें",
      reset: "नए दिन के लिए रीसेट करें",
      resetConfirm: "क्या आप आज के चेक रीसेट करना चाहते हैं?",
      goals: [
        "💧 2-3L पानी और स्वस्थ आहार",
        "🏃‍♂️ 30 मिनट वर्कआउट / व्यायाम",
        "💼 आज का मुख्य काम (Deep Work)",
        "🤝 क्लाइंट आउटरीच / नेटवर्किंग",
        "💊 दैनिक दवाइयां / सप्लीमेंट्स",
        "📖 15 मिनट पढ़ना / माइंडसेट"
      ]
    }
  };

  let currentLang = localStorage.getItem('widget_lang') || 'en';
  let userGoals = JSON.parse(localStorage.getItem('my_multilang_habits'));

  function initGoals() {
    if (!userGoals) {
      userGoals = translations[currentLang].goals.map((text, i) => ({
        id: i + 1,
        text: text,
        done: false,
        isCustom: false
      }));
    }
  }

  function changeLanguage(lang) {
    currentLang = lang;
    localStorage.setItem('widget_lang', lang);
    const langData = translations[lang];

    // Update preset goals to new language while preserving checkbox state
    userGoals = userGoals.map((g, index) => {
      if (!g.isCustom && langData.goals[index]) {
        return { ...g, text: langData.goals[index] };
      }
      return g;
    });

    render();
  }

  function render() {
    localStorage.setItem('my_multilang_habits', JSON.stringify(userGoals));
    const langData = translations[currentLang];

    document.getElementById('langSelect').value = currentLang;
    document.getElementById('titleText').innerText = langData.title;
    document.getElementById('customInput').placeholder = langData.placeholder;
    document.getElementById('addBtn').innerText = langData.add;
    document.getElementById('resetBtn').innerText = langData.reset;

    const listEl = document.getElementById('goalList');
    listEl.innerHTML = '';
    let completedCount = 0;

    userGoals.forEach(goal => {
      if (goal.done) completedCount++;
      const li = document.createElement('li');
      li.className = `goal-item ${goal.done ? 'done' : ''}`;
      li.innerHTML = `
        <label>
          <input type="checkbox" ${goal.done ? 'checked' : ''} onchange="toggleGoal(${goal.id})">
          <span>${goal.text}</span>
        </label>
        ${goal.isCustom ? `<button class="delete-btn" onclick="deleteGoal(${goal.id})">&times;</button>` : ''}
      `;
      listEl.appendChild(li);
    });

    const percent = userGoals.length === 0 ? 0 : Math.round((completedCount / userGoals.length) * 100);
    document.getElementById('progressBar').style.width = percent + '%';
    document.getElementById('progressText').innerText = percent + '% ' + (currentLang === 'hi' ? 'पूरा हुआ' : 'Completed');
    document.getElementById('ratioText').innerText = `${completedCount}/${userGoals.length} Done`;

    const badge = document.getElementById('streakBadge');
    if (percent === 100) {
      badge.innerText = langData.completedBadge;
      badge.style.background = '#10b981';
      badge.style.color = '#000';
    } else if (completedCount > 0) {
      badge.innerText = langData.keepGoing;
      badge.style.background = 'rgba(16, 185, 129, 0.25)';
      badge.style.color = '#10b981';
    } else {
      badge.innerText = langData.ready;
      badge.style.background = 'rgba(16, 185, 129, 0.25)';
      badge.style.color = '#10b981';
    }
  }

  function toggleGoal(id) {
    userGoals = userGoals.map(g => g.id === id ? { ...g, done: !g.done } : g);
    render();
  }

  function addCustomGoal() {
    const input = document.getElementById('customInput');
    const val = input.value.trim();
    if (!val) return;
    userGoals.push({ id: Date.now(), text: "✏️ " + val, done: false, isCustom: true });
    input.value = '';
    render();
  }

  function deleteGoal(id) {
    userGoals = userGoals.filter(g => g.id !== id);
    render();
  }

  function resetToday() {
    if(confirm(translations[currentLang].resetConfirm)) {
      userGoals = userGoals.map(g => ({ ...g, done: false }));
      render();
    }
  }

  initGoals();
  render();
</script>
</body>
</html>
