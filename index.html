<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Done Hai! Habit Tracker</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131c2e;
      --item-bg: rgba(255, 255, 255, 0.04);
      --item-hover: rgba(255, 255, 255, 0.07);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.25);
      --border: #1e293b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .widget-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 420px;
      border-radius: 20px;
      border: 1px solid var(--border);
      padding: 22px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .badge {
      background: var(--accent-glow);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .progress-box {
      margin-bottom: 18px;
    }
    .progress-bar-bg {
      background: #1e293b;
      height: 10px;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .progress-bar-fill {
      background: linear-gradient(90deg, #10b981, #34d399);
      height: 100%;
      width: 0%;
      border-radius: 8px;
      transition: width 0.3s ease;
      box-shadow: 0 0 12px var(--accent);
    }
    .stats {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }
    .goal-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
      max-height: 380px;
      overflow-y: auto;
    }
    .goal-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--item-bg);
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      transition: all 0.2s ease;
    }
    .goal-item:hover {
      background: var(--item-hover);
    }
    .goal-item label {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      font-size: 0.95rem;
      width: 100%;
      user-select: none;
    }
    .goal-item input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border: 2px solid #64748b;
      border-radius: 6px;
      cursor: pointer;
      display: grid;
      place-content: center;
      transition: 0.2s;
    }
    .goal-item input[type="checkbox"]:checked {
      background: var(--accent);
      border-color: var(--accent);
    }
    .goal-item input[type="checkbox"]:checked::before {
      content: "✔";
      font-size: 13px;
      color: #000;
      font-weight: bold;
    }
    .goal-item.done label span {
      text-decoration: line-through;
      color: var(--text-muted);
    }
    .delete-btn {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 1.2rem;
      cursor: pointer;
      padding-left: 8px;
      line-height: 1;
    }
    .add-box {
      display: flex;
      gap: 8px;
    }
    .add-box input {
      flex: 1;
      background: #090d16;
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      outline: none;
      font-size: 0.9rem;
    }
    .add-box input:focus {
      border-color: var(--accent);
    }
    .add-box button {
      background: var(--accent);
      color: #052e16;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .reset-link {
      display: block;
      text-align: center;
      margin-top: 14px;
      font-size: 0.78rem;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="widget-card">
  <div class="header">
    <h1>🎯 Done Hai! Routine</h1>
    <span class="badge" id="streakBadge">⚡ Ready</span>
  </div>

  <div class="progress-box">
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
    <div class="stats">
      <span id="progressText">0% Completed</span>
      <span id="ratioText">0/6 Done</span>
    </div>
  </div>

  <ul class="goal-list" id="goalList"></ul>

  <div class="add-box">
    <input type="text" id="customInput" placeholder="+ Add your custom goal...">
    <button onclick="addCustomGoal()">Add</button>
  </div>

  <span class="reset-link" onclick="resetToday()">Reset for a New Day</span>
</div>

<script>
  const defaultGoals = [
    { id: 1, text: "💧 2-3L Pani & Healthy Diet", done: false, isCustom: false },
    { id: 2, text: "🏃‍♂️ 30 Min Workout / Movement", done: false, isCustom: false },
    { id: 3, text: "💼 Aaj Ka Main Kaam (Deep Work)", done: false, isCustom: false },
    { id: 4, text: "🤝 Client Outreach / Networking", done: false, isCustom: false },
    { id: 5, text: "💊 Dawai / Daily Supplements", done: false, isCustom: false },
    { id: 6, text: "📖 15 Min Reading / Mindset", done: false, isCustom: false }
  ];

  let goals = JSON.parse(localStorage.getItem('my_daily_habits')) || defaultGoals;

  function renderGoals() {
    localStorage.setItem('my_daily_habits', JSON.stringify(goals));
    const listEl = document.getElementById('goalList');
    listEl.innerHTML = '';

    let completedCount = 0;

    goals.forEach(goal => {
      if (goal.done) completedCount++;

      const li = document.createElement('li');
      li.className = `goal-item ${goal.done ? 'done' : ''}`;
      
      li.innerHTML = `
        <label>
          <input type="checkbox" ${goal.done ? 'checked' : ''} onchange="toggleGoal(${goal.id})">
          <span>${goal.text}</span>
        </label>
        ${goal.isCustom ? `<button class="delete-btn" onclick="deleteGoal(${goal.id})">&times;</button>` : ''}
      `;
      listEl.appendChild(li);
    });

    const percent = goals.length === 0 ? 0 : Math.round((completedCount / goals.length) * 100);
    document.getElementById('progressBar').style.width = percent + '%';
    document.getElementById('progressText').innerText = percent + '% Completed';
    document.getElementById('ratioText').innerText = `${completedCount}/${goals.length} Done`;

    const badge = document.getElementById('streakBadge');
    if (percent === 100) {
      badge.innerText = '🔥 100% Done Hai!';
      badge.style.background = '#10b981';
      badge.style.color = '#000';
    } else {
      badge.innerText = '⚡ Keep Going';
      badge.style.background = 'rgba(16, 185, 129, 0.25)';
      badge.style.color = '#10b981';
    }
  }

  function toggleGoal(id) {
    goals = goals.map(g => g.id === id ? { ...g, done: !g.done } : g);
    renderGoals();
  }

  function addCustomGoal() {
    const input = document.getElementById('customInput');
    const val = input.value.trim();
    if (!val) return;

    goals.push({ id: Date.now(), text: "✏️ " + val, done: false, isCustom: true });
    input.value = '';
    renderGoals();
  }

  function deleteGoal(id) {
    goals = goals.filter(g => g.id !== id);
    renderGoals();
  }

  function resetToday() {
    if(confirm('Kya aap aaj ke checks reset karna chahte hain?')) {
      goals = goals.map(g => ({ ...g, done: false }));
      renderGoals();
    }
  }

  renderGoals();
</script>
</body>
</html>
